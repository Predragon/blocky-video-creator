<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a0f2e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Head -->
  <rect x="196" y="80" width="120" height="120" rx="8" fill="#FFCC99"/>
  <!-- Eyes -->
  <rect x="222" y="120" width="22" height="22" rx="2" fill="#fff"/>
  <rect x="268" y="120" width="22" height="22" rx="2" fill="#fff"/>
  <rect x="226" y="124" width="14" height="14" rx="2" fill="#111"/>
  <rect x="272" y="124" width="14" height="14" rx="2" fill="#111"/>
  <!-- Mouth -->
  <rect x="240" y="160" width="32" height="8" rx="2" fill="#333"/>
  <!-- Hair -->
  <rect x="190" y="70" width="132" height="30" rx="4" fill="#1a1a1a"/>
  <!-- Torso -->
  <rect x="196" y="210" width="120" height="130" rx="6" fill="#FF0000"/>
  <!-- Left Arm -->
  <rect x="156" y="210" width="36" height="110" rx="6" fill="#FF0000"/>
  <rect x="160" y="320" width="28" height="28" rx="4" fill="#FFCC99"/>
  <!-- Right Arm -->
  <rect x="320" y="140" width="36" height="110" rx="6" fill="#FF0000" transform="rotate(-30, 338, 195)"/>
  <rect x="330" y="100" width="28" height="28" rx="4" fill="#FFCC99" transform="rotate(-30, 344, 114)"/>
  <!-- Legs -->
  <rect x="200" y="345" width="50" height="110" rx="6" fill="#1a3a5c"/>
  <rect x="262" y="345" width="50" height="110" rx="6" fill="#1a3a5c"/>
  <!-- Shoes -->
  <rect x="195" y="450" width="58" height="24" rx="4" fill="#222"/>
  <rect x="258" y="450" width="58" height="24" rx="4" fill="#222"/>
  <!-- Film strip accent -->
  <rect x="40" y="440" width="432" height="4" rx="2" fill="#FFD93D" opacity="0.6"/>
</svg>
